<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактировать расход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <a href="/expenses" class="back-link">← Вернуться к списку</a>

    <div class="card form-narrow">
        <h1 style="margin-bottom: 24px;">Редактировать расход</h1>

        <form th:action="@{'/expenses/update/' + ${expense.id}}" method="post" th:object="${expense}">
            <div class="form-row">
                <label for="description">Описание</label>
                <input id="description" type="text" th:field="*{description}">
                <span class="error-msg" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-row">
                <label for="amount">Сумма, <span th:text="${currencySymbol}">₽</span></label>
                <input id="amount" type="number" step="0.01" th:field="*{amount}">
                <span class="error-msg" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
            </div>

            <div class="form-row">
                <label for="category">Категория</label>
                <input id="category" type="text" list="categories" th:field="*{category}">
                <datalist id="categories">
                    <option value="Еда">
                    <option value="Транспорт">
                    <option value="Развлечения">
                    <option value="Здоровье">
                    <option value="Дом">
                    <option value="Одежда">
                    <option value="Прочее">
                </datalist>
                <span class="error-msg" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
            </div>

            <div class="form-row">
                <label for="date">Дата</label>
                <input id="date" type="date" th:field="*{date}">
                <span class="error-msg" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/expenses" class="btn btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
